name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m py_compile scripts/operator_miniapp_status.py tests/test_operator_miniapp_status.py
      - name: Tests
        run: pytest -q
      - name: Smoke collect
        run: python scripts/operator_miniapp_status.py --config tests/fixtures/sample-config.yaml collect --pretty
